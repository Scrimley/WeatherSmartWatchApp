name: weather_app
description: "A simple location based weather smart watch app."
publish_to: 'none'
version: 1.2.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  http: ^1.6.0
  wear_plus: ^1.2.4
  location: ^10.0.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_pre_commit: ^6.1.0
  git_hooks: ^1.0.2

flutter:
  uses-material-design: true
