name: PR Check

on:
  pull_request:
    branches: [ 'main' ]

env:
  WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}

jobs:
  pr-check:
    runs-on: ubuntu-latest
    name: Check PR

    steps:
      - uses: actions/checkout@v6
        id: checkout
        with:
          submodules: true
          lfs: false
          ref: ${{ github.ref }}

      - name: Set Up Flutter
        id: set-up-flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter --version
      - run: flutter pub get

      - name: Analyze Code
        id: analyze-code
        run: flutter analyze

      - name: Build APK
        id: android-build-apk
        run: flutter build apk --release
